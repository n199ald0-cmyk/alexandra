<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Catch That iPhone!</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;}
html,body{height:100%;margin:0;background:#1a1020;overflow:hidden;overscroll-behavior:none;
  font-family:'Baloo 2',sans-serif;touch-action:none;-webkit-user-select:none;user-select:none;}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
  display:flex;align-items:center;justify-content:center;overscroll-behavior:none;}
#wrap{position:relative;width:100%;max-width:420px;height:100vh;max-height:900px;
  margin:0 auto;overflow:hidden;touch-action:none;background:#000;
  box-shadow:0 0 60px rgba(0,0,0,.6);}
canvas{display:block;width:100%;height:100%;image-rendering:auto;}
#hud{position:absolute;top:calc(12px + env(safe-area-inset-top,0px));left:0;right:0;
  display:flex;justify-content:space-between;padding:0 14px;pointer-events:none;z-index:5;}
#tag{background:rgba(255,255,255,.85);color:#b5507a;font-weight:700;font-size:13px;
  padding:6px 12px;border-radius:20px;box-shadow:0 3px 0 rgba(0,0,0,.15);}
#score{background:linear-gradient(180deg,#ffe08a,#ffc23c);color:#6b3d00;font-weight:700;
  font-size:14px;padding:6px 14px;border-radius:20px;box-shadow:0 3px 0 rgba(0,0,0,.2);}
#overlay,#startOverlay{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;
  justify-content:center;background:radial-gradient(circle at 50% 30%,rgba(60,20,50,.92),rgba(15,8,20,.96));
  color:#fff;text-align:center;padding:26px;z-index:10;gap:16px;}
#startOverlay{display:flex;}
.card{background:linear-gradient(180deg,#fff7ee,#ffe9d6);border-radius:22px;padding:26px 22px;
  box-shadow:0 10px 0 rgba(0,0,0,.25), 0 20px 40px rgba(0,0,0,.4);max-width:300px;}
#overlay h1{font-size:26px;color:#e0426a;margin:0 0 6px;font-weight:700;}
#overlay p{font-size:14px;line-height:1.6;color:#7a5a4a;margin:0 0 16px;}
#startOverlay h1{font-size:24px;background:linear-gradient(180deg,#ffdd6b,#ffb238);-webkit-background-clip:text;
  background-clip:text;color:transparent;margin:0 0 8px;text-shadow:0 2px 0 rgba(0,0,0,.15);}
#startOverlay p{font-size:13px;line-height:1.7;color:#f0dced;margin:0;max-width:280px;}
#payBtn,#startBtn{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;
  touch-action:manipulation;-webkit-tap-highlight-color:transparent;cursor:pointer;
  background:linear-gradient(180deg,#ff9bb0,#ea4f78);color:#fff;border:none;
  padding:14px 22px;border-radius:16px;cursor:pointer;box-shadow:0 5px 0 #b52e52, 0 8px 16px rgba(0,0,0,.3);
  letter-spacing:.3px;}
#payBtn:active,#startBtn:active{transform:translateY(4px);box-shadow:0 1px 0 #b52e52;}
#startBtn{background:linear-gradient(180deg,#7fe0d0,#2fb6a6);box-shadow:0 5px 0 #1c7d72,0 8px 16px rgba(0,0,0,.3);margin-top:6px;}
#startBtn:active{box-shadow:0 1px 0 #1c7d72;}
</style>
</head>
<body>
<div id="wrap">
  <canvas id="game"></canvas>
  <div id="hud"><span id="tag">📱 Catch!</span><span id="score">$0</span></div>
  <div id="overlay">
    <div class="card">
      <h1>Oh no! 💥</h1>
      <p id="finalScore">The phone shattered.<br>You earned $0 this round.</p>
      <button id="payBtn">Pay $260 to<br>play again</button>
    </div>
  </div>
  <div id="startOverlay">
    <h1>Catch That<br>iPhone!</h1>
    <p>Phones tumble from the ceiling — drag your finger to slide the girl left and right and catch them for $25 each. Miss one and it shatters. Restarting costs $260, taken straight out of your winnings.</p>
    <button id="startBtn">Start Playing</button>
  </div>
</div>
<script>
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const wrap=document.getElementById('wrap');
let W,H,scale,VH;
function resize(){
  W=wrap.clientWidth;H=wrap.clientHeight;
  canvas.width=W;canvas.height=H;
  scale=W/180; VH=H/scale;
}
resize();window.addEventListener('resize',resize);

const IMG={};
let loadedCount=0, totalImgs=Object.keys(SRC).length;
function stripWhiteBg(img){
  const c=document.createElement('canvas');
  c.width=img.naturalWidth; c.height=img.naturalHeight;
  const x=c.getContext('2d');
  x.drawImage(img,0,0);
  const d=x.getImageData(0,0,c.width,c.height), a=d.data;
  for(let i=0;i<a.length;i+=4){
    if(a[i]>242 && a[i+1]>242 && a[i+2]>242) a[i+3]=0;
  }
  x.putImageData(d,0,0);
  const out=new Image();
  out.src=c.toDataURL('image/png');
  return out;
}
for(const k in SRC){
  const im=new Image();
  im.onload=()=>{
    if(k==='boy'){
      const clear=stripWhiteBg(im);
      clear.onload=()=>{IMG.boy=clear; loadedCount++;};
    } else loadedCount++;
  };
  im.src=SRC[k];
  IMG[k]=im;
}
// sprite aspect ratios (w/h) for consistent virtual sizing
const GIRL_W=52, GIRL_H=GIRL_W*(346/260);
const PHONE_W=23, PHONE_H=PHONE_W*(300/180);
const BOY_W=52, BOY_H=GIRL_W*(580/260);

const BASE_FALL=3.6, BASE_SPAWN=40;
const G={state:'start',score:0,wallet:0,girlX:80,girlTX:80,speed:2.8,groundY:0,
  phones:[],spawnTimer:0,spawnEvery:BASE_SPAWN,fallSpeed:BASE_FALL,frame:0,animTimer:0,shake:0,pops:[],tier:0};

function applyDifficulty(){
  const tier=Math.floor(G.score/100);
  G.fallSpeed=Math.min(BASE_FALL+tier*0.7,10);
  G.spawnEvery=Math.max(BASE_SPAWN-tier*5,16);
  if(tier>G.tier){
    G.tier=tier;
    G.pops.push({text:'FASTER!',x:G.girlX+GIRL_W/2,y:G.groundY-GIRL_H-14,t:0});
  }
}

function reset(){
  G.state='playing';G.score=0;G.phones=[];G.spawnTimer=0;G.tier=0;
  G.fallSpeed=BASE_FALL;G.spawnEvery=BASE_SPAWN;G.girlX=80;G.girlTX=80;G.frame=0;G.pops=[];
  document.getElementById('overlay').style.display='none';
  updateHud();
}
function updateHud(){document.getElementById('score').textContent='$'+G.wallet;}

function isUiTap(e){return !!(e.target&&e.target.closest&&e.target.closest('button'));}
function setGirlFromTouch(e){
  const t=e.touches[0];const rect=wrap.getBoundingClientRect();
  const x=(t.clientX-rect.left)/scale;
  G.girlTX=Math.max(6,Math.min(180-GIRL_W-6,x-GIRL_W/2));
}
wrap.addEventListener('touchstart',e=>{
  if(isUiTap(e))return;
  if(G.state!=='playing')return;
  e.preventDefault();
  setGirlFromTouch(e);
},{passive:false});
wrap.addEventListener('touchmove',e=>{
  if(isUiTap(e))return;
  if(G.state!=='playing')return;
  e.preventDefault();
  setGirlFromTouch(e);
},{passive:false});
document.addEventListener('gesturestart',e=>e.preventDefault());
document.addEventListener('dblclick',e=>e.preventDefault());
let mouseDown=false;
wrap.addEventListener('mousedown',e=>{if(!isUiTap(e))mouseDown=true;});
window.addEventListener('mouseup',()=>mouseDown=false);
wrap.addEventListener('mousemove',e=>{
  if(!mouseDown||G.state!=='playing')return;
  const rect=wrap.getBoundingClientRect();
  const x=(e.clientX-rect.left)/scale;
  G.girlTX=Math.max(6,Math.min(180-GIRL_W-6,x-GIRL_W/2));
});
window.addEventListener('keydown',e=>{
  if(G.state!=='playing')return;
  if(e.key==='ArrowLeft')G.girlTX=Math.max(6,G.girlTX-10);
  if(e.key==='ArrowRight')G.girlTX=Math.min(180-GIRL_W-6,G.girlTX+10);
});

function startGame(){
  if(G.state==='playing')return;
  document.getElementById('startOverlay').style.display='none';
  reset();
}
function payRestart(){
  if(G.state==='playing')return;
  G.wallet-=260;reset();
}
const startBtn=document.getElementById('startBtn');
const payBtn=document.getElementById('payBtn');
startBtn.addEventListener('click',startGame);
payBtn.addEventListener('click',payRestart);
// Mobile: touchend is more reliable than click when parent uses touch-action:none
startBtn.addEventListener('touchend',e=>{e.preventDefault();startGame();},{passive:false});
payBtn.addEventListener('touchend',e=>{e.preventDefault();payRestart();},{passive:false});

function px(x,y,w,h,color){ctx.fillStyle=color;ctx.fillRect(Math.round(x*scale),Math.round(y*scale),Math.ceil(w*scale),Math.ceil(h*scale));}
function rrect(x,y,w,h,r,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.roundRect(x*scale,y*scale,w*scale,h*scale,r*scale);
  ctx.fill();
}
function shadow(x,y,w){
  ctx.fillStyle='rgba(30,20,35,.28)';
  ctx.beginPath();
  ctx.ellipse(x*scale,y*scale,w*scale,3.2*scale,0,0,Math.PI*2);
  ctx.fill();
}

function drawBackground(){
  G.groundY=VH*0.78;
  if(IMG.bg.complete && IMG.bg.naturalWidth){
    ctx.drawImage(IMG.bg,0,0,W,H);
  } else {
    ctx.fillStyle='#e9d9c4'; ctx.fillRect(0,0,W,H);
  }
}

function drawGirlLike(img,x,y,mode){
  shadow(x+GIRL_W/2,y+GIRL_H-2,GIRL_W*0.4);
  ctx.save();
  let lunge=0, tilt=0;
  if(mode==='punch'){ lunge=4; tilt=-4; }
  ctx.translate((x+GIRL_W/2+lunge)*scale,(y+GIRL_H/2)*scale);
  ctx.rotate(tilt*Math.PI/180);
  if(img.complete && img.naturalWidth){
    ctx.drawImage(img,-GIRL_W/2*scale,-GIRL_H/2*scale,GIRL_W*scale,GIRL_H*scale);
  }
  ctx.restore();
}

function drawBoy(x,y,hits,flash,finalKnock){
  const kx = hits*4 + (finalKnock? Math.min((G.animTimer-G.punchTimes[4]-6)*1.4,26):0);
  const ang = -Math.min(hits*7,26) - (finalKnock? Math.min((G.animTimer-G.punchTimes[4]-6)*1.2,20):0);
  const jolt = flash? (Math.random()-0.5)*4 : 0;
  const cx=x+BOY_W/2, footY=y+BOY_H;
  ctx.save();
  ctx.translate(cx*scale,footY*scale);
  ctx.translate(-cx*scale,-footY*scale);
  shadow(cx,footY-1,BOY_W*0.38);
  ctx.save();
  ctx.translate((cx+kx+jolt)*scale,(y+BOY_H*0.42)*scale);
  ctx.rotate(ang*Math.PI/180);
  ctx.translate(-cx*scale,-(y+BOY_H*0.42)*scale);
  if(IMG.boy && IMG.boy.complete && IMG.boy.naturalWidth){
    ctx.imageSmoothingEnabled=false;
    if(hits>0) ctx.filter='saturate(0.7) sepia(0.35) hue-rotate(-20deg)';
    ctx.drawImage(IMG.boy,x*scale,y*scale,BOY_W*scale,BOY_H*scale);
    ctx.filter='none';
    ctx.imageSmoothingEnabled=true;

  }
  // mercedes logo centered on white t-shirt
  if(IMG.logo && IMG.logo.complete && IMG.logo.naturalWidth){
    const logoSz=BOY_W*0.36;
    const lx=cx-logoSz/2, ly=y+BOY_H*0.40;
    ctx.save();
    ctx.beginPath();
    ctx.arc(cx*scale,(ly+logoSz/2)*scale,(logoSz/2+0.4)*scale,0,Math.PI*2);
    ctx.fillStyle='#fff'; ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.2)';
    ctx.lineWidth=Math.max(1,0.7*scale); ctx.stroke();
    ctx.beginPath();
    ctx.arc(cx*scale,(ly+logoSz/2)*scale,(logoSz/2)*scale,0,Math.PI*2);
    ctx.clip();
    ctx.drawImage(IMG.logo,lx*scale,ly*scale,logoSz*scale,logoSz*scale);
    ctx.restore();
  }
  ctx.restore();
  ctx.restore();
}
function drawPhone(p){
  ctx.save();
  ctx.shadowColor='rgba(0,0,0,.35)'; ctx.shadowBlur=4*scale; ctx.shadowOffsetY=2*scale;
  if(IMG.phone.complete && IMG.phone.naturalWidth){
    ctx.drawImage(IMG.phone,p.x*scale,p.y*scale,PHONE_W*scale,PHONE_H*scale);
  }
  ctx.restore();
}

function spawnPhone(){const x=8+Math.random()*(172-PHONE_W-8);G.phones.push({x,y:-30,caught:false});}

function update(){
  if(G.state!=='playing'){ if(G.state==='punch') updatePunch(); return; }
  G.frame++;
  G.girlX += (G.girlTX-G.girlX)*0.35;
  G.spawnTimer++;
  if(G.spawnTimer>=G.spawnEvery){
    G.spawnTimer=0; spawnPhone();
  }
  for(const p of G.phones){
    if(p.caught)continue;
    p.y+=G.fallSpeed;
    const catchY=G.groundY-GIRL_H+8;
    if(p.y+PHONE_H>=catchY-6 && p.y+PHONE_H<=catchY+14){
      if(p.x+PHONE_W>G.girlX-2 && p.x<G.girlX+GIRL_W+2){
        p.caught=true; G.score+=25; G.wallet+=25; updateHud();
        applyDifficulty();
        G.pops.push({text:'+$25',x:G.girlX+GIRL_W/2,y:G.groundY-GIRL_H-6,t:0});
      }
    }
    if(p.y>G.groundY-4 && !p.caught){
      G.state='punch';G.animTimer=0;G.phones=[];G.shake=10;
      G.punchTimes=[8,22,36,50,64];G.hitsLanded=0;
      break;
    }
  }
  G.phones=G.phones.filter(p=>!p.caught && p.y<VH+10);
}

const PUNCH_WORDS=['POW!','BAM!','WHACK!','POK!','KO!!!'];
function updatePunch(){
  G.animTimer++;
  if(G.shake>0)G.shake*=0.85;
  const t=G.animTimer;
  for(let i=0;i<G.punchTimes.length;i++){
    const impact=G.punchTimes[i]+6;
    if(t===impact){ G.hitsLanded=i+1; G.shake=8+i*2.4; }
  }
  const lastImpact=G.punchTimes[4]+6;
  if(t>lastImpact+42){
    G.state='gameover';
    document.getElementById('finalScore').innerHTML='The phone shattered.<br>You earned $'+G.score+' this round.';
    document.getElementById('overlay').style.display='flex';
  }
}

function drawPunchScene(){
  drawBackground();
  const t=G.animTimer, girlX=44, boyX=104;
  const hits=G.hitsLanded||0;
  const lastImpact=G.punchTimes[4]+6;
  const finalKnock=t>lastImpact;
  let flash=false, punching=false, flashIdx=-1;
  for(let i=0;i<G.punchTimes.length;i++){
    const wind=G.punchTimes[i], impact=wind+6;
    if(t>=wind && t<impact+3) punching=true;
    if(t>=impact && t<impact+9){flash=true; flashIdx=i;}
  }
  ctx.save();
  if(G.shake>0.3){ctx.translate((Math.random()-0.5)*G.shake,(Math.random()-0.5)*G.shake);}
  drawBoy(boyX,G.groundY-BOY_H,hits,flash,finalKnock);
  const witchImg = t>6 ? IMG.witch : IMG.girl;
  drawGirlLike(witchImg,girlX,G.groundY-GIRL_H,punching?'punch':'idle');
  if(t<=10){
    const p=t/10;
    ctx.fillStyle='rgba(140,90,220,'+(0.5*(1-p))+')';
    ctx.beginPath();ctx.arc((girlX+GIRL_W/2)*scale,(G.groundY-GIRL_H/2)*scale,(6+p*22)*scale,0,Math.PI*2);ctx.fill();
    for(let i=0;i<6;i++){
      const ang=i*1.05+t*0.3;
      const rr=(10+p*20);
      px(girlX+GIRL_W/2+Math.cos(ang)*rr-1,(G.groundY-GIRL_H/2)+Math.sin(ang)*rr*0.6-1,2,2,'#e6d4ff');
    }
  }
  if(flash && flashIdx>=0){
    const p=(t-(G.punchTimes[flashIdx]+6))/9;
    ctx.save();
    const wobX=boyX+2+flashIdx*3, wobY=G.groundY-54-flashIdx*4;
    ctx.translate(wobX*scale,wobY*scale);ctx.rotate((-0.12-flashIdx*0.05));
    const sz=(11+flashIdx*1.6)*scale;
    ctx.font='bold '+sz+'px "Baloo 2",sans-serif';
    ctx.strokeStyle=flashIdx>=4?'#20202a':'#e0426a';ctx.lineWidth=3*scale;
    ctx.fillStyle=flashIdx>=4?'#ffe08a':'#fff2a8';
    ctx.strokeText(PUNCH_WORDS[flashIdx],0,0);ctx.fillText(PUNCH_WORDS[flashIdx],0,0);
    ctx.restore();
    ctx.fillStyle='rgba(255,255,255,'+(0.4*(1-p))+')';
    ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
}

function drawPops(){
  G.pops=G.pops.filter(p=>p.t<32);
  ctx.font='bold '+(10*scale)+'px "Baloo 2",sans-serif';
  ctx.textAlign='center';
  G.pops.forEach(p=>{
    p.t++;
    ctx.globalAlpha=1-p.t/32;
    ctx.fillStyle='#ffb238';
    ctx.strokeStyle='rgba(0,0,0,.4)'; ctx.lineWidth=2.5*scale;
    const yy=(p.y-p.t*0.7)*scale, xx=p.x*scale;
    ctx.strokeText(p.text,xx,yy); ctx.fillText(p.text,xx,yy);
  });
  ctx.globalAlpha=1; ctx.textAlign='left';
}

function draw(){
  if(G.state==='punch'){drawPunchScene();return;}
  drawBackground();
  for(const p of G.phones)drawPhone(p);
  drawGirlLike(IMG.girl,G.girlX,G.groundY-GIRL_H,'idle');
  drawPops();
}

function loop(){update();draw();requestAnimationFrame(loop);}
loop();
</script>
